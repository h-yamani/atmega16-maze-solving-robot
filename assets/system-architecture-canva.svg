<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">ATmega16 Labyrinth Robot System Architecture</title>
  <desc id="desc">Closed-loop flow from obstacle and floor sensors through ADC, navigation, state, movement selection, motor control and robot motion, with LCD status output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef6fb"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#4b6683"/></marker>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#16324f" flood-opacity=".13"/></filter>
  </defs>

  <rect width="1400" height="900" rx="30" fill="url(#bg)"/>
  <text x="700" y="58" text-anchor="middle" fill="#102a46" font-family="DejaVu Sans, Arial, sans-serif" font-size="35" font-weight="700">ATmega16 Labyrinth Robot — System Architecture</text>
  <text x="700" y="95" text-anchor="middle" fill="#64748b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18">Closed-loop sensing, mapping, decision and motion pipeline</text>

  <!-- Main-flow arrows -->
  <g fill="none" stroke="#4b6683" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)">
    <path d="M345 235H395"/>
    <path d="M665 235H715"/>
    <path d="M985 235H1035"/>
    <path d="M1170 310V485"/>
    <path d="M1035 560H985"/>
    <path d="M715 560H665"/>
    <path d="M395 560H345"/>
    <path d="M75 560C25 560 25 390 75 310"/>
    <path d="M850 310C850 430 1180 610 1180 715"/>
  </g>

  <g font-family="DejaVu Sans, Arial, sans-serif">
    <!-- 1 Sensors -->
    <g transform="translate(75 160)">
      <rect width="270" height="150" rx="24" fill="#e2f0ff" stroke="#3b82f6" stroke-width="3"/>
      <circle cx="42" cy="42" r="24" fill="#3b82f6"/><text x="42" y="50" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">1</text>
      <g transform="translate(199 30)" fill="none" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round">
        <circle cx="20" cy="20" r="6" fill="#1d4ed8" stroke="none"/><path d="M30 10Q42 20 30 30M38 3Q57 20 38 37"/>
      </g>
      <text x="135" y="91" text-anchor="middle" fill="#1e40af" font-size="21" font-weight="700">Obstacle &amp; Floor</text>
      <text x="135" y="117" text-anchor="middle" fill="#1e40af" font-size="21" font-weight="700">Sensors</text>
      <text x="135" y="140" text-anchor="middle" fill="#52677f" font-size="14">walls + path alignment</text>
    </g>

    <!-- 2 ADC -->
    <g transform="translate(395 160)">
      <rect width="270" height="150" rx="24" fill="#ddfaf4" stroke="#14b8a6" stroke-width="3"/>
      <circle cx="42" cy="42" r="24" fill="#14b8a6"/><text x="42" y="50" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">2</text>
      <path d="M196 52h16l9-22 14 43 9-21h17" fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="135" y="94" text-anchor="middle" fill="#115e59" font-size="22" font-weight="700">ATmega16 ADC</text>
      <text x="135" y="124" text-anchor="middle" fill="#52677f" font-size="15">sensor sampling and</text>
      <text x="135" y="145" text-anchor="middle" fill="#52677f" font-size="15">threshold classification</text>
    </g>

    <!-- 3 Navigation -->
    <g transform="translate(715 160)">
      <rect width="270" height="150" rx="24" fill="#102f50" stroke="#2dd4bf" stroke-width="3"/>
      <circle cx="42" cy="42" r="24" fill="#2dd4bf"/><text x="42" y="50" text-anchor="middle" fill="#083344" font-size="21" font-weight="700">3</text>
      <circle cx="225" cy="48" r="23" fill="none" stroke="#a7f3d0" stroke-width="3"/><path d="M225 29l8 19-8 19-8-19z" fill="#f59e0b"/>
      <text x="135" y="94" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">Maze Navigation</text>
      <text x="135" y="121" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">Logic</text>
      <text x="135" y="144" text-anchor="middle" fill="#b9d9eb" font-size="14">evaluate valid directions</text>
    </g>

    <!-- 4 State -->
    <g transform="translate(1035 160)">
      <rect width="270" height="150" rx="24" fill="#f0eaff" stroke="#8b5cf6" stroke-width="3"/>
      <circle cx="42" cy="42" r="24" fill="#8b5cf6"/><text x="42" y="50" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">4</text>
      <g transform="translate(203 26)" fill="none" stroke="#6d28d9" stroke-width="3"><rect width="47" height="47" rx="4"/><path d="M0 16h47M0 32h47M16 0v47M32 0v47"/><circle cx="24" cy="24" r="5" fill="#f59e0b" stroke="none"/></g>
      <text x="135" y="94" text-anchor="middle" fill="#5b21b6" font-size="21" font-weight="700">Grid Map &amp;</text>
      <text x="135" y="121" text-anchor="middle" fill="#5b21b6" font-size="21" font-weight="700">Heading State</text>
      <text x="135" y="144" text-anchor="middle" fill="#52677f" font-size="14">cell status + orientation</text>
    </g>

    <!-- 5 Selection -->
    <g transform="translate(1035 485)">
      <rect width="270" height="150" rx="24" fill="#fff2d9" stroke="#f59e0b" stroke-width="3"/>
      <circle cx="42" cy="42" r="24" fill="#f59e0b"/><text x="42" y="50" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">5</text>
      <g transform="translate(203 30)" fill="none" stroke="#b45309" stroke-width="4" stroke-linecap="round"><path d="M24 45V4M24 4L10 18M24 4l14 14M24 28L8 43M24 28l17 15"/></g>
      <text x="135" y="94" text-anchor="middle" fill="#92400e" font-size="21" font-weight="700">Movement</text>
      <text x="135" y="121" text-anchor="middle" fill="#92400e" font-size="21" font-weight="700">Selection</text>
      <text x="135" y="144" text-anchor="middle" fill="#52677f" font-size="14">unexplored before revisits</text>
    </g>

    <!-- 6 Motor control -->
    <g transform="translate(715 485)">
      <rect width="270" height="150" rx="24" fill="#fee2e2" stroke="#ef4444" stroke-width="3"/>
      <circle cx="42" cy="42" r="24" fill="#ef4444"/><text x="42" y="50" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">6</text>
      <g transform="translate(202 27)" fill="none" stroke="#b91c1c" stroke-width="4"><circle cx="24" cy="24" r="17"/><circle cx="24" cy="24" r="5" fill="#b91c1c"/><path d="M24 0v8M24 40v8M0 24h8M40 24h8M7 7l6 6M35 35l6 6M41 7l-6 6M13 35l-6 6"/></g>
      <text x="135" y="94" text-anchor="middle" fill="#991b1b" font-size="21" font-weight="700">Stepper-Motor</text>
      <text x="135" y="121" text-anchor="middle" fill="#991b1b" font-size="21" font-weight="700">Control</text>
      <text x="135" y="144" text-anchor="middle" fill="#52677f" font-size="14">phase sequences + turns</text>
    </g>

    <!-- 7 Motion -->
    <g transform="translate(395 485)">
      <rect width="270" height="150" rx="24" fill="#e1f3ff" stroke="#38bdf8" stroke-width="3"/>
      <circle cx="42" cy="42" r="24" fill="#38bdf8"/><text x="42" y="50" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">7</text>
      <g transform="translate(200 31)" fill="none" stroke="#0369a1" stroke-width="4"><rect x="3" y="10" width="46" height="26" rx="10"/><circle cx="14" cy="39" r="8"/><circle cx="38" cy="39" r="8"/><path d="M13 10l7-9h15l7 9"/></g>
      <text x="135" y="104" text-anchor="middle" fill="#075985" font-size="22" font-weight="700">Robot Motion</text>
      <text x="135" y="137" text-anchor="middle" fill="#52677f" font-size="14">advance to the next cell</text>
    </g>

    <!-- feedback card -->
    <g transform="translate(75 485)">
      <rect width="270" height="150" rx="24" fill="#ecfdf5" stroke="#22c55e" stroke-width="3" stroke-dasharray="8 6"/>
      <circle cx="42" cy="42" r="24" fill="#22c55e"/><path d="M29 42a13 13 0 1 0 5-10" fill="none" stroke="#fff" stroke-width="4"/><path d="M27 26l8 6-10 3" fill="#fff"/>
      <text x="135" y="94" text-anchor="middle" fill="#166534" font-size="21" font-weight="700">Physical Feedback</text>
      <text x="135" y="124" text-anchor="middle" fill="#52677f" font-size="15">new position produces</text>
      <text x="135" y="145" text-anchor="middle" fill="#52677f" font-size="15">new sensor readings</text>
    </g>

    <!-- LCD branch -->
    <g transform="translate(1035 715)">
      <rect width="270" height="125" rx="24" fill="#e9edf4" stroke="#64748b" stroke-width="3"/>
      <circle cx="42" cy="38" r="23" fill="#64748b"/><text x="42" y="46" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">↳</text>
      <rect x="195" y="24" width="55" height="38" rx="4" fill="#172554" stroke="#94a3b8" stroke-width="3"/><path d="M203 36h39M203 48h28" stroke="#67e8f9" stroke-width="3"/>
      <text x="135" y="86" text-anchor="middle" fill="#334155" font-size="21" font-weight="700">16-Character LCD</text>
      <text x="135" y="111" text-anchor="middle" fill="#52677f" font-size="14">sensor, position and status</text>
    </g>

    <text x="213" y="445" text-anchor="middle" fill="#3f5d78" font-size="15" font-weight="700">CLOSED-LOOP FEEDBACK</text>
    <text x="1070" y="684" text-anchor="middle" fill="#64748b" font-size="15" font-weight="700">STATUS OUTPUT</text>
  </g>
</svg>
